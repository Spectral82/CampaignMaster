{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2>Клиенты</h2>
  <a class="btn btn-primary" href="{% url 'mailings:recipient_create' %}">Добавить клиента</a>
</div>
<table class="table">
  <tr><th>Email</th><th>Ф. И. О.</th><th></th></tr>
  {% for r in recipients %}
  <tr>
    <td>{{ r.email }}</td>
    <td>{{ r.full_name }}</td>
    <td>
      <a href="{% url 'mailings:recipient_detail' r.pk %}">Открыть</a>
      <a href="{% url 'mailings:recipient_update' r.pk %}">Изменить</a>
      <a href="{% url 'mailings:recipient_delete' r.pk %}">Удалить</a>
    </td>
  </tr>
  {% empty %}<tr><td colspan="3">Клиентов пока нет.</td></tr>{% endfor %}
</table>
{% endblock %}
