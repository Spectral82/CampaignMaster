<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}CampaignMaster{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'main:home' %}">CampaignMaster</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'mailings:mailing_list' %}">Рассылки</a>
      <a class="nav-link" href="{% url 'mailings:recipient_list' %}">Клиенты</a>
      <a class="nav-link" href="{% url 'mailings:message_list' %}">Сообщения</a>
      <a class="nav-link" href="{% url 'mailings:stats' %}">Статистика</a>
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'mailings:attempt_list' %}">Попытки</a>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">{% csrf_token %}
          <button class="btn btn-outline-light btn-sm">Выход</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'users:login' %}">Вход</a>
        <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container">
  {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
